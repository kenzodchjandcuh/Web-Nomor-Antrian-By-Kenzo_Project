<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Antrian Cerdas - Display</title>
    <meta name="description" content="Tampilan sistem nomor antrian cerdas dan modern.">
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <header>
        <h1><i class="fa-solid fa-layer-group"></i> AntrianPro</h1>
        <nav class="nav-links">
            <a href="index.html" class="active">Display</a>
            <a href="admin.html">Admin Login</a>
        </nav>
    </header>

    <main>
        <div class="glass-card">
            <div class="queue-label">Nomor Antrian Saat Ini</div>
            <div class="queue-display">
                <div class="queue-number" id="current-queue">A-000</div>
            </div>
            
            <!-- Loket / Meja Pelayanan Tujuan -->
            <div id="calling-desk-container" style="display: none; margin-bottom: 2rem;">
                <div style="font-size: 1rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 0.5rem;">Silakan Menuju Ke</div>
                <div id="calling-desk" style="font-size: 2.2rem; font-weight: 800; color: var(--primary); text-shadow: 0 0 20px rgba(59, 130, 246, 0.4); background: rgba(59, 130, 246, 0.05); padding: 0.8rem 1.5rem; border-radius: 12px; border: 1px solid rgba(59, 130, 246, 0.2); display: inline-block;">-</div>
            </div>
            
            <p id="queue-instruction" style="color: var(--text-muted); margin-bottom: 2rem;">Silakan menuju loket saat nomor Anda dipanggil.</p>
            
            <button class="btn btn-primary animate-pulse" id="btn-ambil-tiket" style="width: 100%; font-size: 1.2rem; padding: 1.2rem;">
                <i class="fa-solid fa-ticket"></i> Ambil Nomor Antrian
            </button>
        </div>
    </main>

    <footer style="text-align: center; padding: 1.5rem; color: var(--text-muted); font-size: 0.9rem; width: 100%;">
        &copy; 2026 by kenzo_project
    </footer>

    <!-- Modal Registrasi Pengunjung -->
    <div class="modal-overlay" id="register-modal">
        <div class="modal-content" style="max-width: 450px; text-align: left;">
            <h3 style="margin-bottom: 1.2rem; color: var(--text-main); font-weight: 800; display: flex; align-items: center; gap: 0.5rem;">
                <i class="fa-solid fa-address-card" style="color: var(--primary);"></i> Registrasi Antrian
            </h3>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">
                Silakan isi data diri Anda untuk mengambil nomor antrian.
            </p>
            <form id="register-form">
                <div class="form-group">
                    <label for="reg-name"><i class="fa-solid fa-user"></i> Nama Lengkap</label>
                    <input type="text" id="reg-name" class="form-control" placeholder="Masukkan nama lengkap Anda" required>
                </div>
                <div class="form-group">
                    <label for="reg-ktp"><i class="fa-solid fa-id-card"></i> Nomor KTP</label>
                    <input type="text" id="reg-ktp" class="form-control" placeholder="Masukkan 16 digit nomor KTP" pattern="[0-9]{16}" title="Nomor KTP harus berupa 16 digit angka" required>
                </div>
                <div class="form-group">
                    <label for="reg-phone"><i class="fa-solid fa-phone"></i> Nomor HP</label>
                    <input type="tel" id="reg-phone" class="form-control" placeholder="Contoh: 081234567890" pattern="[0-9]{10,14}" title="Nomor HP harus berupa angka (10-14 digit)" required>
                </div>
                <div class="form-group">
                    <label for="reg-address"><i class="fa-solid fa-location-dot"></i> Alamat Lengkap</label>
                    <textarea id="reg-address" class="form-control" placeholder="Masukkan alamat lengkap" style="resize: vertical; min-height: 80px;" required></textarea>
                </div>
                <div style="display: flex; gap: 0.5rem; margin-top: 2rem;">
                    <button type="button" class="btn btn-outline" id="btn-close-register" style="flex: 1;">Batal</button>
                    <button type="submit" class="btn btn-primary" id="btn-submit-register" style="flex: 1;">Ambil Tiket</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Tiket -->
    <div class="modal-overlay" id="ticket-modal">
        <div class="modal-content" style="max-width: 350px;">
            <div id="ticket-capture" style="padding: 2rem; background: var(--bg-dark); border-radius: 12px; margin-bottom: 1rem; border: 1px solid var(--glass-border); position: relative; overflow: hidden;">
                <div style="position: absolute; top: -50px; left: -50px; width: 100px; height: 100px; background: var(--primary); opacity: 0.2; filter: blur(20px); border-radius: 50%;"></div>
                <h3 style="margin-bottom: 0.5rem; color: var(--text-main);">Tiket Antrian Anda</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Simpan foto tiket ini</p>
                <div class="ticket-number" id="modal-ticket-number" style="font-size: 3.5rem; margin: 1.5rem 0; text-shadow: none;">A-000</div>
                <div style="font-size: 0.8rem; color: var(--text-muted);" id="ticket-date"></div>
                <!-- Info Pengunjung di Tiket -->
                <div id="ticket-user-info" style="margin-top: 1.5rem; border-top: 1px dashed var(--glass-border); padding-top: 1rem; text-align: left; font-size: 0.85rem;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.4rem;">
                        <span style="color: var(--text-muted); font-family: 'Inter', sans-serif;">Nama:</span>
                        <span id="ticket-name" style="color: var(--text-main); font-weight: 600; font-family: 'Inter', sans-serif; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; max-width: 180px;">-</span>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span style="color: var(--text-muted); font-family: 'Inter', sans-serif;">KTP:</span>
                        <span id="ticket-ktp" style="color: var(--text-main); font-weight: 600; font-family: 'Inter', sans-serif;">-</span>
                    </div>
                </div>
            </div>
            <div style="display: flex; gap: 0.5rem;">
                <button class="btn btn-outline" id="btn-download" style="flex: 1; font-size: 0.9rem; padding: 0.8rem;"><i class="fa-solid fa-download"></i> Simpan Foto</button>
                <button class="btn btn-primary" id="btn-close-modal" style="flex: 1; font-size: 0.9rem; padding: 0.8rem;">Tutup</button>
            </div>
        </div>
    </div>

    <!-- Audio Element for Bell -->
    <audio id="bell-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <audio id="voice-sound" src="" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, get, update } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

        // =========================================================================
        // TODO: GANTI BAGIAN INI DENGAN CONFIG FIREBASE PROJECT ANDA
        // =========================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAYC6ON6h5csqT-0bK_cUJLI16f4ucfrgE",
            authDomain: "antrianpro1.firebaseapp.com",
            databaseURL: "https://antrianpro1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "antrianpro1",
            storageBucket: "antrianpro1.firebasestorage.app",
            messagingSenderId: "883903710328",
            appId: "1:883903710328:web:996126ee5361a59ea0d98d",
            measurementId: "G-M3ED7W19PX"
        };
        // =========================================================================

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const queueRef = ref(db, 'queue');

        // System variables
        const currentQueueEl = document.getElementById('current-queue');
        const btnAmbil = document.getElementById('btn-ambil-tiket');
        const ticketModal = document.getElementById('ticket-modal');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const btnDownload = document.getElementById('btn-download');
        const modalTicketNumber = document.getElementById('modal-ticket-number');
        const ticketDate = document.getElementById('ticket-date');
        const bellSound = document.getElementById('bell-sound');

        // Format number with prefix
        function formatQueue(num) {
            return 'A-' + num.toString().padStart(3, '0');
        }

        // Check if user already has a ticket
        async function checkMyTicket() {
            const myTicket = localStorage.getItem('my_ticket');
            if (myTicket) {
                btnAmbil.classList.remove('animate-pulse');
                btnAmbil.style.background = 'rgba(59, 130, 246, 0.2)';
                btnAmbil.style.color = 'var(--text-main)';
                btnAmbil.style.border = '1px solid var(--primary)';
                btnAmbil.innerHTML = `<i class="fa-solid fa-ticket"></i> Lihat Tiket Saya: ${formatQueue(myTicket)}`;
                btnAmbil.style.cursor = 'pointer';
            } else {
                btnAmbil.classList.add('animate-pulse');
                btnAmbil.style.background = '';
                btnAmbil.style.color = '';
                btnAmbil.style.border = '';
                btnAmbil.innerHTML = `<i class="fa-solid fa-ticket"></i> Ambil Nomor Antrian`;
                btnAmbil.style.cursor = 'pointer';
            }
        }

        let lastCallTrigger = null;

        // Listen for Realtime Changes from Firebase
        onValue(queueRef, (snapshot) => {
            const data = snapshot.val() || { current: 0, total: 0, call_trigger: 0, current_desk: "" };
            
            // Update Display
            currentQueueEl.innerText = formatQueue(data.current || 0);

            // Update Desk Routing Display
            const callingDeskContainer = document.getElementById('calling-desk-container');
            const callingDeskEl = document.getElementById('calling-desk');
            const queueInstruction = document.getElementById('queue-instruction');

            if ((data.current || 0) > 0 && data.current_desk) {
                callingDeskEl.innerText = data.current_desk;
                callingDeskContainer.style.display = 'block';
                if (queueInstruction) queueInstruction.style.display = 'none';
            } else {
                callingDeskContainer.style.display = 'none';
                if (queueInstruction) queueInstruction.style.display = 'block';
            }

            // Add update animation
            currentQueueEl.classList.add('updating');
            setTimeout(() => currentQueueEl.classList.remove('updating'), 500);

            // Play sound if call_trigger changed
            if (data.call_trigger && data.call_trigger !== lastCallTrigger && lastCallTrigger !== null) {
                playCallSound();
            }
            lastCallTrigger = data.call_trigger;

            // If admin resets queue, allow taking new ticket
            if (data.total === 0 && localStorage.getItem('my_ticket')) {
                localStorage.removeItem('my_ticket');
                checkMyTicket();
            }
        });

        // Registration Modal Elements
        const registerModal = document.getElementById('register-modal');
        const registerForm = document.getElementById('register-form');
        const btnCloseRegister = document.getElementById('btn-close-register');

        // Function to handle "Ambil Tiket"
        btnAmbil.addEventListener('click', async () => {
            const myTicket = localStorage.getItem('my_ticket');
            if (myTicket) {
                // View existing ticket
                btnAmbil.disabled = true;
                const originalText = btnAmbil.innerHTML;
                btnAmbil.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memuat Tiket...`;
                
                try {
                    const ticketSnapshot = await get(ref(db, `queue/tickets/${myTicket}`));
                    if (ticketSnapshot.exists()) {
                        const ticketData = ticketSnapshot.val();
                        
                        // Set current date for ticket
                        const ticketTime = ticketData.timestamp ? new Date(ticketData.timestamp) : new Date();
                        ticketDate.innerText = ticketTime.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute:'2-digit' });

                        // Fill Ticket modal details
                        document.getElementById('ticket-name').innerText = ticketData.name || '-';
                        const ktp = ticketData.ktp || '';
                        document.getElementById('ticket-ktp').innerText = ktp ? (ktp.slice(0, 4) + ' •••• •••• ' + ktp.slice(12)) : '-';

                        // Show Ticket Modal
                        modalTicketNumber.innerText = formatQueue(myTicket);
                        ticketModal.classList.add('active');
                    } else {
                        // Ticket not found in Firebase (e.g. database was reset)
                        localStorage.removeItem('my_ticket');
                        checkMyTicket();
                        alert("Tiket lama Anda tidak ditemukan di server (kemungkinan database di-reset). Silakan ambil tiket baru.");
                    }
                } catch (error) {
                    console.error("Gagal memuat tiket lama:", error);
                    alert("Koneksi gagal saat memuat tiket.");
                } finally {
                    btnAmbil.disabled = false;
                    checkMyTicket();
                }
                return;
            }

            // Otherwise, open registration modal
            registerForm.reset();
            registerModal.classList.add('active');
        });

        btnCloseRegister.addEventListener('click', () => {
            registerModal.classList.remove('active');
        });

        // Function to handle form submission
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const nameVal = document.getElementById('reg-name').value.trim();
            const ktpVal = document.getElementById('reg-ktp').value.trim();
            const phoneVal = document.getElementById('reg-phone').value.trim();
            const addressVal = document.getElementById('reg-address').value.trim();

            if (!nameVal || !ktpVal || !phoneVal || !addressVal) {
                alert("Semua data harus diisi!");
                return;
            }

            if (ktpVal.length !== 16 || isNaN(ktpVal)) {
                alert("Nomor KTP harus 16 digit angka!");
                return;
            }

            if (phoneVal.length < 10 || phoneVal.length > 14 || isNaN(phoneVal)) {
                alert("Nomor HP harus berupa angka (10-14 digit)!");
                return;
            }

            const btnSubmit = document.getElementById('btn-submit-register');
            const originalSubmitText = btnSubmit.innerHTML;
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memproses...`;

            try {
                // Get current total from Firebase
                const snapshot = await get(queueRef);
                let data = snapshot.val() || {};
                let total = (data.total || 0) + 1;

                // Update database atomically
                const updates = {};
                updates['total'] = total;
                updates['update_trigger'] = Date.now();
                updates[`tickets/${total}`] = {
                    number: total,
                    name: nameVal,
                    ktp: ktpVal,
                    phone: phoneVal,
                    address: addressVal,
                    timestamp: Date.now()
                };

                await update(queueRef, updates);
                
                // Store user's ticket locally and update UI
                localStorage.setItem('my_ticket', total.toString());
                checkMyTicket();
                
                // Set current date for ticket
                const now = new Date();
                ticketDate.innerText = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute:'2-digit' });

                // Fill Ticket modal details
                document.getElementById('ticket-name').innerText = nameVal;
                document.getElementById('ticket-ktp').innerText = ktpVal.slice(0, 4) + ' •••• •••• ' + ktpVal.slice(12);

                // Hide registration modal
                registerModal.classList.remove('active');
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = originalSubmitText;

                // Show Ticket Modal
                modalTicketNumber.innerText = formatQueue(total);
                ticketModal.classList.add('active');
            } catch (error) {
                console.error("Gagal mengambil tiket:", error);
                alert("Koneksi Firebase gagal. Pastikan Config Firebase sudah diatur.");
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = originalSubmitText;
            }
        });

        btnCloseModal.addEventListener('click', () => {
            ticketModal.classList.remove('active');
        });

        // Download Ticket Image
        btnDownload.addEventListener('click', () => {
            const captureArea = document.getElementById('ticket-capture');
            const originalBorder = captureArea.style.border;
            captureArea.style.border = 'none'; // remove border for clean image
            
            const originalBg = captureArea.style.backgroundColor;
            captureArea.style.backgroundColor = '#09090b'; 
            
            html2canvas(captureArea, {
                scale: 3,
                backgroundColor: '#09090b',
                logging: false
            }).then(canvas => {
                captureArea.style.border = originalBorder;
                captureArea.style.backgroundColor = originalBg;
                
                const link = document.createElement('a');
                link.download = `Antrian-${modalTicketNumber.innerText}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                console.error("Gagal menyimpan foto", err);
                captureArea.style.border = originalBorder;
                captureArea.style.backgroundColor = originalBg;
            });
        });

        // Play calling sound
        function playCallSound() {
            bellSound.currentTime = 0;
            bellSound.play().catch(e => console.log('Audio play failed', e));
            
            // Visual feedback
            currentQueueEl.classList.add('updating');
            setTimeout(() => currentQueueEl.classList.remove('updating'), 1000);
        }

        // Run on load
        checkMyTicket();
    </script>
</body>
</html>
